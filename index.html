<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>CodeQuest — Apprends à coder en jouant</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --card: #fff;
        --text: #1b1f2a;
        --muted: #667085;
        --accent: #4f46e5;
        --ok: #16a34a;
        --ko: #dc2626;
        --code: #0f172a;
        --codetext: #e2e8f0;
        --border: #e4e7ee;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b0f1a;
          --card: #141a2a;
          --text: #e8ebf4;
          --muted: #98a2b3;
          --accent: #818cf8;
          --border: #252d44;
          --code: #070a12;
        }
      }

      :root[data-theme="dark"] {
        --bg: #0b0f1a;
        --card: #141a2a;
        --text: #e8ebf4;
        --muted: #98a2b3;
        --accent: #818cf8;
        --border: #252d44;
        --code: #070a12;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 16px;
      }

      main {
        width: 100%;
        max-width: 760px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px;
        margin-top: 12px;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0 0 4px;
      }

      h2 {
        margin: 0 0 6px;
        font-size: 1.2rem;
      }

      p {
        line-height: 1.5;
        color: var(--muted);
        margin: 6px 0;
      }

      label {
        display: block;
        font-size: 0.85rem;
        margin: 14px 0 4px;
        color: var(--muted);
      }

      input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 1rem;
      }

      button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 14px;
        font-weight: 600;
      }

      button.ghost {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--border);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .bar {
        display: flex;
        gap: 2px;
        margin: 10px 0;
      }

      .bar i {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: var(--border);
      }

      .bar i.on {
        background: var(--accent);
      }

      .bar i.done {
        background: var(--ok);
      }

      textarea {
        width: 100%;
        height: 170px;
        background: var(--code);
        color: var(--codetext);
        border: 0;
        border-radius: 10px;
        padding: 12px;
        font:
          14px/1.5 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        resize: vertical;
      }

      pre {
        background: var(--code);
        color: var(--codetext);
        border-radius: 10px;
        padding: 12px;
        min-height: 90px;
        margin: 0;
        white-space: pre-wrap;
        font:
          14px/1.5 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        overflow-x: auto;
      }

      .cols {
        display: grid;
        gap: 12px;
        grid-template-columns: 1fr;
      }

      @media (min-width: 700px) {
        .cols {
          grid-template-columns: 1fr 1fr;
        }
      }

      .tag {
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .msg {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 0.95rem;
      }

      .msg.ok {
        background: rgba(22, 163, 74, 0.14);
        color: var(--ok);
      }

      .msg.ko {
        background: rgba(220, 38, 38, 0.12);
        color: var(--ko);
      }

      .hint {
        font-size: 0.9rem;
        color: var(--muted);
        margin-top: 8px;
      }

      .hidden {
        display: none;
      }

      code {
        background: var(--bg);
        padding: 1px 6px;
        border-radius: 5px;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>🎮 CodeQuest</h1>
      <p>Apprends à coder en résolvant des défis, niveau par niveau.</p>

      <section id="register" class="card">
        <h2>Crée ton profil</h2>
        <label for="nom">Nom</label
        ><input id="nom" autocomplete="family-name" />
        <label for="prenom">Prénom</label
        ><input id="prenom" autocomplete="given-name" />
        <button id="start">Commencer l’aventure</button>
        <div id="regerr" class="msg ko hidden">
          Merci de remplir ton nom et ton prénom.
        </div>
      </section>

      <section id="game" class="card hidden">
        <div class="top"><span id="who"></span><span id="lvlinfo"></span></div>
        <div class="bar" id="bar"></div>
        <h2 id="title"></h2>
        <p id="goal"></p>
        <div class="cols" id="cols">
          <div>
            <div class="tag">Ton code (JavaScript)</div>
            <textarea id="code" spellcheck="false"></textarea>
          </div>
          <div>
            <div class="tag">Résultat</div>
            <pre id="out">Clique sur « Exécuter ».</pre>
          </div>
        </div>
        <input
          id="ans"
          class="hidden"
          placeholder="Ta réponse"
          autocomplete="off"
        />
        <textarea
          id="exp"
          class="hidden"
          placeholder="Explique ta méthode, étape par étape…"
          style="
            height: 130px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            font: inherit;
            margin-top: 6px;
          "
        ></textarea>
        <button id="run">▶ Exécuter</button>
        <button id="hintbtn" class="ghost">💡 Indice</button>
        <div id="hint" class="hint hidden"></div>
        <div id="msg" class="msg hidden"></div>
        <button id="next" class="hidden">Niveau suivant →</button>
      </section>

      <section id="end" class="card hidden">
        <h2 id="endtitle"></h2>
        <p>
          Tu as terminé tous les niveaux : code, logique et algorithmique. Tu as
          de solides bases !
        </p>
        <button id="restart" class="ghost">Recommencer</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
